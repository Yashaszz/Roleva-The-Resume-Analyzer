    unknown: { job_match: [55, 72], quality: [63, 80], ats: [78, 92] }

# Percentiles are hidden below this many samples in a cohort. Showing a
# percentile drawn from eleven people would be a statistic in appearance only.
percentile_minimum_sample: 30
