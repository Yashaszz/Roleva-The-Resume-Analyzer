[project]
name = "roleva-api"
version = "0.1.0"
description = "Roleva analysis engine"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24",
    "rapidfuzz>=3.10",
    "python-dateutil>=2.9",
    "google-genai>=0.3",
    "httpx>=0.27",
    "supabase>=2.9",
    "pyjwt[crypto]>=2.9",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "types-python-dateutil",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roleva*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# RUF001 flags Unicode characters that resemble ASCII. These modules exist
# precisely to recognise and normalise those characters, so the glyphs are the
# subject matter rather than a typo, and the tests assert on them directly.
"roleva/parsing/normalizer.py" = ["RUF001"]
"roleva/parsing/sectionizer.py" = ["RUF001"]
"roleva/parsing/contact.py" = ["RUF001"]
"roleva/parsing/dates.py" = ["RUF001", "RUF002"]
"roleva/parsing/spans.py" = ["RUF001"]
"roleva/quality/metrics.py" = ["RUF001", "SIM905"]
"roleva/ats/rules.py" = ["RUF001", "RUF002"]
"tests/**" = ["RUF001"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*", "supabase.*", "google.genai.*"]
ignore_missing_imports = true

# PyMuPDF ships incomplete type information. Rather than scattering ignores
# through the parsing code, one shim module absorbs the untyped surface and
# presents a typed API to everything else.
[[tool.mypy.overrides]]
module = ["roleva.parsing._pymupdf"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits live external services; skipped when unconfigured",
]
